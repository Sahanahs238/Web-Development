<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .products{
            background-color: blue;
            height: 120vh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap:20px;
            flex-wrap: wrap;
        }
        .box{
            background-color: blueviolet;
            height: 120px;
            width:150px;
            color: white;
            border: 1px solid blue;
        }
    </style>
</head>
<body>
    <div class="products">
        <div class="box">cake</div>
        <div class="box">juice</div>
        <div class="box">coke</div>
    </div>
</body>
</html>
